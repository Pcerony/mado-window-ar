<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1714"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="data:,"><title>MADO · 窗外来客</title><link rel="stylesheet" href="ar.css"></head>
<body><main id="ar-app"><video id="camera" playsinline muted autoplay aria-label="后置相机画面"></video><div id="projection" aria-hidden="true"><canvas id="creature" width="1400" height="750"></canvas></div><div class="camera-shade"></div>
<header><a href="./" aria-label="返回车窗">まど<span>AR</span></a><span id="tracking" role="status"><b></b><span id="tracking-text">相机未开启</span></span><button id="help" class="round" aria-label="查看对准方式" title="对准方式"><i data-lucide="scan-line"></i></button></header>
<div id="reticle" class="reticle" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<section id="start-panel" class="panel"><div class="symbol"><i data-lucide="camera"></i></div><h1>窗外来客</h1><p id="camera-message">将 Mac 上的四个标记完整收入画面</p><button id="start-camera" class="primary"><i data-lucide="camera"></i>开启相机</button><p class="privacy">相机画面仅在本机处理，不上传</p></section>
<div id="scan-hint" hidden>对准车窗的四个标记</div>
<footer><button id="stop-camera" class="round" hidden aria-label="关闭相机" title="关闭相机"><i data-lucide="camera-off"></i></button><span id="scan-count" hidden>0 / 4</span><button id="flip-camera" class="round" hidden aria-label="切换摄像头" title="切换摄像头"><i data-lucide="switch-camera"></i></button></footer>
<dialog id="help-dialog"><button id="close-help" class="round close" aria-label="关闭"><i data-lucide="x"></i></button><h2>对准车窗</h2><div class="screen-guide"><b></b><b></b><b></b><b></b><i data-lucide="train-front"></i></div><p>Mac 打开车窗，点击手机图标。让四个黑白标记完整出现在取景画面里。</p><p>避开屏幕反光，尽量正对屏幕。横竖屏均可。</p></dialog>
</main><script src="icons.js"></script><script src="vendor/cv.js"></script><script src="vendor/aruco.js"></script><script src="vendor/perspective.js"></script><script type="module" src="ar.mjs"></script></body></html>
