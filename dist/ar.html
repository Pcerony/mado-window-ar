<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1714"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="data:,"><title>MADO · 窓の向こう</title><link rel="stylesheet" href="ar.css"><link rel="stylesheet" href="ar-landscape.css?v=3"></head>
<body><main id="ar-app"><video id="camera" playsinline muted autoplay aria-label="背面カメラの映像"></video><div id="projection" aria-hidden="true"><canvas id="creature" width="1400" height="750"></canvas></div><div class="camera-shade"></div>
<header><a href="./" aria-label="車窓に戻る">まど<span>AR</span></a><span id="tracking" role="status"><b></b><span id="tracking-text">カメラ停止中</span></span><button id="help" class="round" aria-label="合わせ方を見る" title="合わせ方"><i data-lucide="scan-line"></i></button></header>
<div id="reticle" class="reticle" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<section id="start-panel" class="panel"><div class="symbol"><i data-lucide="camera"></i></div><h1>窓の向こう</h1><p id="camera-message">Mac の4つのマーカーを画面に収めてください</p><button id="start-camera" class="primary"><i data-lucide="camera"></i>カメラを起動</button><p class="privacy">映像は端末内で処理され、送信されません</p></section>
<div id="scan-hint" hidden>4つのマーカーに合わせてください</div>
<footer><button id="stop-camera" class="round" hidden aria-label="カメラを停止" title="カメラを停止"><i data-lucide="camera-off"></i></button><span id="scan-count" hidden>0 / 4</span><button id="flip-camera" class="round" hidden aria-label="カメラを切り替え" title="カメラを切り替え"><i data-lucide="switch-camera"></i></button></footer>
<dialog id="help-dialog"><button id="close-help" class="round close" aria-label="閉じる"><i data-lucide="x"></i></button><h2>車窓に合わせる</h2><div class="screen-guide"><b></b><b></b><b></b><b></b><i data-lucide="train-front"></i></div><p>Mac でスマートフォンのアイコンを押し、4つの白黒マーカーをカメラに収めてください。</p><p>画面の反射を避け、できるだけ正面から映してください。</p></dialog>
<section id="rotate-device" aria-label="横向きにしてください"><div class="rotate-symbol"><i data-lucide="smartphone"></i><i data-lucide="rotate-cw"></i></div><h1>横向きにしてください</h1><button id="rotation-help" class="round" aria-label="画面の回転について" title="画面の回転ロックを解除してください"><i data-lucide="info"></i></button><p id="rotation-message" hidden>画面の回転ロックを解除してください</p></section>
</main><script src="icons.js"></script><script src="vendor/cv.js"></script><script src="vendor/aruco.js"></script><script src="vendor/perspective.js"></script><script type="module" src="ar.mjs?v=3"></script></body></html>
