<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8e9e3"><link rel="icon" href="data:,"><title>まど MADO · 沿线</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="journey">
  <header class="heading"><a class="wordmark" href="./" aria-label="Mado 首页">まど<span>MADO</span></a><div class="route"><span class="route-line"></span><span>沿线</span><span class="route-jp">車窓の旅</span></div><button id="fullscreen" class="icon-button" aria-label="全屏" title="全屏"><i data-lucide="maximize"></i></button></header>
  <section class="carriage" aria-label="日本电车车窗动态风景">
    <div class="rail"><div class="plaque">普通<span>LOCAL</span></div><div class="screws"><b></b><b></b></div><div class="car-number">モハ  103-28</div></div>
    <div class="window-outer"><div class="window-rubber"><div class="window-view"><canvas id="landscape" aria-label="不断流动的日本田园、小镇与小都市"></canvas><div class="glass"></div><div class="window-divider"></div><div class="latch"></div></div></div><div class="sill"></div></div>
    <div class="wall-bottom"><div class="warning">窓から手や顔を出さないでください</div><div class="seat"></div></div>
  </section>
  <footer><div class="where"><span class="live-dot"></span><span id="district">田野之间</span><span class="distance"><span id="distance">0.0</span> km</span></div><div class="controls"><button id="pause" class="icon-button" title="暂停" aria-label="暂停" aria-pressed="false"><i data-lucide="pause"></i></button><span class="separator"></span><i data-lucide="gauge" class="speed-icon" aria-hidden="true"></i><input id="speed" type="range" min="0.3" max="2" step="0.1" value="1" aria-label="行驶速度"><output id="speed-value" for="speed">1.0×</output><span class="separator"></span><button id="sound" class="icon-button" title="开启电车声" aria-label="开启电车声" aria-pressed="false"><i data-lucide="volume-x"></i></button></div><div class="footer-mark">どこまでも、</div></footer>
</main><script src="icons.js"></script><script type="module" src="app.mjs"></script></body></html>
